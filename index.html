<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AutoFix</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

    <div class="login-box">

        <h1>AutoFix</h1>

        <p>Sistema de gerenciamento da oficina</p>

        <form id="loginForm">

            <label>E-mail</label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label>Senha</label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

            <p id="mensagem"></p>

        </form>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
