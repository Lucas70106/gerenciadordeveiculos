<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AutoFix - Serviços</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <div>

            <h1>AutoFix</h1>

            <p>
                Problemas e Serviços
            </p>

        </div>

        <a href="sistema.html">
            Voltar
        </a>

    </header>


    <main class="container">

        <h2>
            Problemas, soluções e pagamentos
        </h2>


        <div class="form-card">

            <form id="servicoForm">

                <label>Cliente</label>

                <input
                    type="text"
                    id="clienteServico"
                    placeholder="Nome do cliente"
                    required
                >


                <label>Veículo</label>

                <input
                    type="text"
                    id="veiculoServico"
                    placeholder="Placa e modelo"
                    required
                >


                <label>
                    Problema apresentado
                </label>

                <textarea
                    id="problema"
                    placeholder="Descreva o problema do veículo"
                    required
                ></textarea>


                <label>
                    Solução / serviço recomendado
                </label>

                <textarea
                    id="solucao"
                    placeholder="Informe o serviço que deverá ser realizado"
                    required
                ></textarea>


                <label>
                    Valor do serviço
                </label>

                <input
                    type="number"
                    step="0.01"
                    id="valorServico"
                    placeholder="R$ 0,00"
                    required
                >


                <label>Status</label>

                <select id="statusServico">

                    <option value="Aberto">
                        Aberto
                    </option>

                    <option value="Em andamento">
                        Em andamento
                    </option>

                    <option value="Concluído">
                        Concluído
                    </option>

                </select>


                <button type="submit">
                    Registrar serviço
                </button>

            </form>

        </div>


        <div class="table-card">

            <h3>
                Serviços registrados
            </h3>

            <table>

                <thead>

                    <tr>

                        <th>Cliente</th>

                        <th>Veículo</th>

                        <th>Problema</th>

                        <th>Solução</th>

                        <th>Valor</th>

                        <th>Status</th>

                    </tr>

                </thead>

                <tbody id="listaServicos">

                </tbody>

            </table>

        </div>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
