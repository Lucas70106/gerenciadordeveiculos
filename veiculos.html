<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AutoFix - Veículos</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <div>
            <h1>AutoFix</h1>
            <p>Cadastro de Veículos</p>
        </div>

        <a href="sistema.html">
            Voltar
        </a>

    </header>


    <main class="container">

        <h2>Veículos cadastrados na oficina</h2>


        <div class="form-card">

            <form id="veiculoForm">

                <label>Cliente</label>

                <input
                    type="text"
                    id="clienteVeiculo"
                    placeholder="Nome do proprietário"
                    required
                >


                <label>Placa</label>

                <input
                    type="text"
                    id="placa"
                    placeholder="ABC-1234"
                    required
                >


                <label>Marca</label>

                <input
                    type="text"
                    id="marca"
                    placeholder="Ex: Volkswagen"
                    required
                >


                <label>Modelo</label>

                <input
                    type="text"
                    id="modelo"
                    placeholder="Ex: Gol"
                    required
                >


                <label>Ano</label>

                <input
                    type="number"
                    id="ano"
                    placeholder="2025"
                >


                <label>Cor</label>

                <input
                    type="text"
                    id="cor"
                    placeholder="Ex: Preto"
                >


                <button type="submit">
                    Cadastrar veículo
                </button>

            </form>

        </div>


        <div class="table-card">

            <h3>Veículos cadastrados</h3>

            <table>

                <thead>

                    <tr>
                        <th>Cliente</th>
                        <th>Placa</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Ano</th>
                        <th>Cor</th>
                    </tr>

                </thead>

                <tbody id="listaVeiculos">

                </tbody>

            </table>

        </div>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
